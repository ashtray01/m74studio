name: Windows build & release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: m74studio
    env:
      CGO_ENABLED: '1'
      GOOS: windows
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: m74studio/go.mod
          cache-dependency-path: m74studio/go.sum
      - name: Install MinGW-w64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Add compiler to PowerShell PATH
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          Join-Path $env:MSYS2_LOCATION 'mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Verify Go modules
        run: |
          go mod download
          if ($LASTEXITCODE -ne 0) { throw 'Module download failed' }
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'Module verification failed' }
      - name: Test, vet and build
        run: ./build.ps1
      - name: Check executable exports using a portable fixture
        run: ./scripts/check-cli.ps1
      - name: Package ZIP and SHA-256
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: M74Studio-windows-x64
          path: m74studio/dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: M74Studio-windows-x64
          path: dist
      - name: Create release with verified build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "M74 Studio $RELEASE_TAG"
          fi
